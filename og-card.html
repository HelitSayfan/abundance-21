<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --deep:#234444; --deeper:#1d3838; --teal:#375c5c;
      --peach:#f7c2a8; --peach-soft:#fde9de; --coral:#ee9b84;
      --pink:#f2b5c2; --mint:#b7daca;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      width:1200px;
      height:630px;
      overflow:hidden;
      font-family:'Heebo',sans-serif;
      background:
        radial-gradient(850px 480px at 50% 100%,rgba(247,194,168,.42),transparent 70%),
        radial-gradient(650px 420px at 12% 8%,rgba(242,181,194,.32),transparent 70%),
        radial-gradient(650px 420px at 88% 12%,rgba(183,218,202,.4),transparent 70%),
        linear-gradient(180deg,#f6faf8 0%,#edf4f1 100%);
      color:var(--deep);
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      padding:44px 32px 0;
    }
    .eyebrow{
      display:inline-block;
      font:600 15px 'Heebo',sans-serif;
      letter-spacing:.1em;
      color:var(--teal);
      margin-bottom:10px;
      text-transform:uppercase;
    }
    h1{
      font-size:64px;
      font-weight:800;
      line-height:1.05;
      letter-spacing:-.03em;
      color:var(--deep);
      margin-bottom:10px;
    }
    .sub{
      font-size:22px;
      font-weight:600;
      color:var(--teal);
      margin-bottom:8px;
    }
    .lead{
      font-size:16px;
      line-height:1.55;
      color:#446161;
      max-width:820px;
      margin-bottom:18px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font:600 15px 'Heebo',sans-serif;
      border-radius:999px;
      padding:11px 28px;
      background:linear-gradient(135deg,var(--peach),var(--pink));
      color:var(--deeper);
      box-shadow:0 10px 24px -10px rgba(238,155,132,.85);
      margin-bottom:24px;
    }
    .btn::after{
      content:"←";
    }

    /* Cards fan at bottom */
    .cards-fan{
      position:relative;
      width:100%;
      height:260px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .card{
      position:absolute;
      width:380px;
      height:220px;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 20px 40px -10px rgba(18,35,36,.22);
      border:1px solid rgba(255,255,255,.5);
      background:#fff;
      transition:transform .3s;
    }
    .card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    /* Fan layout */
    .c-outer-left{
      transform:translateX(-360px) rotate(-14deg) scale(0.72);
      z-index:1;
      filter:brightness(0.92);
    }
    .c-mid-left{
      transform:translateX(-230px) rotate(-7deg) scale(0.85);
      z-index:2;
      filter:brightness(0.96);
    }
    .c-center{
      transform:translateX(0) rotate(0deg) scale(1);
      z-index:5;
      box-shadow:0 24px 50px -12px rgba(18,35,36,.32);
    }
    .c-mid-right{
      transform:translateX(230px) rotate(7deg) scale(0.85);
      z-index:2;
      filter:brightness(0.96);
    }
    .c-outer-right{
      transform:translateX(360px) rotate(14deg) scale(0.72);
      z-index:1;
      filter:brightness(0.92);
    }
  </style>
</head>
<body>
  <span class="eyebrow">מסע דיגיטלי קבוצתי של 21 ימים</span>
  <h1>להעיר את השפע</h1>
  <p class="sub">מה משתנה כשאנחנו מתחילים להסתכל על החיים קצת אחרת?</p>
  <p class="lead">21 ימים של מדיטציות, תרגילי התבוננות ותרגול יומי, שיעזרו לכם להרחיב את נקודת המבט, לזהות אפשרויות חדשות ולפתוח מקום לרצונות ולעשייה.</p>
  <div class="btn">אני רוצה להצטרף</div>

  <div class="cards-fan">
    <div class="card c-outer-left"><img src="assets/days/day-05.webp" alt=""></div>
    <div class="card c-mid-left"><img src="assets/days/day-06.webp" alt=""></div>
    <div class="card c-center"><img src="assets/days/day-07.webp" alt=""></div>
    <div class="card c-mid-right"><img src="assets/days/day-08.webp" alt=""></div>
    <div class="card c-outer-right"><img src="assets/days/day-09.webp" alt=""></div>
  </div>
</body>
</html>
